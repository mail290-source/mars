<style>

  .batch-tag.b2{ background:#FCE4D6; color:#8A4416; }
  small.hint{ color: var(--ink-soft); font-size:11.5px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }

  .cal-cell{ aspect-ratio:1/1; border-radius:10px; border:1px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; font-size:13px; background:#F7F9FB; color:var(--ink); }
  .cal-cell.blank{ background:transparent; cursor:default; }
  .cal-cell .dnum{ font-weight:700; }
  .cal-cell .dot{ width:6px; height:6px; border-radius:50%; margin-top:3px; }
  .cal-cell.today{ border:2px solid var(--gold); }

  .cal-cell.selected{ background: var(--navy); color:#fff; }

  .cal-cell.incomplete-mark::before{ content:"!"; position:absolute; top:2px; left:5px; font-size:9px; font-weight:900; color:var(--coral); }

  .daytype-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .daytype-legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .date-detail-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .date-detail-head .ddate{ font-size:15px; font-weight:800; color:var(--navy); }
  .status-chip{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .status-chip.done{ background:var(--teal-soft); color:var(--teal); }
  .status-chip.pending{ background:var(--gold-soft); color:#7A5312; }
  .status-chip.missing{ background:var(--coral-soft); color:var(--coral); }
  .status-chip.future{ background:#EDEFF2; color:var(--ink-soft); }
  .note-card{ background:#F7F5EE; border:1px dashed #DDD3B8; border-radius:12px; padding:10px 12px; font-size:13px; color:#6B5B2E; margin-bottom:8px; }
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:360px; background:var(--card); border-radius:22px; padding:28px 24px; border:1px solid var(--line); box-shadow:0 10px 30px rgba(20,35,55,.1); }
  .login-card .mark{ width:52px;height:52px;border-radius:16px; background:var(--gold); display:flex;align-items:center;justify-content:center; font-size:26px; margin:0 auto 14px; }
  .login-card h1{ text-align:center; font-size:18px; color:var(--navy); margin:0 0 4px; }

  .trash-item{ opacity:.9; }

<script type="module">
/* ---------------- Firebase 初始化 ---------------- */

import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIUrtN60FK_NkxrGFdRKM1DTZhUAiyhB4",

  messagingSenderId: "357400325878",
  appId: "1:357400325878:web:4958e018648217e29ac6d7",
  measurementId: "G-P25CX1EX1H"

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const STATE_DOC = doc(db, "familyApp", "state");

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}

/* ---------------- 密碼雜湊（基本保護，非企業級加密） ---------------- */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ---------------- 資料模型 ---------------- */
const SESSION_KEY = "star_bank_session_v2";
let state = null;
let session = null;          // { accountId, actingAs? }
let currentAccountId = null; // 目前畫面上顯示的帳號（可能是被管理者假扮的對象）
let activeTab = null;
let childViewFilter = null;
let calMonth = null;
let selectedDate = null;
let isOnline = true;
let suppressNextSnapshot = false;
let loginError = "";

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function pad2(n){ return String(n).padStart(2,"0"); }
function toDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return toDateStr(new Date()); }
function parseDateStr(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
const WEEKDAY_LABELS = ["日","一","二","三","四","五","六"];
const DT_SCHOOL = "dt_school", DT_HOLIDAY = "dt_holiday", DT_BIRTHDAY = "dt_birthday", DT_SPECIAL = "dt_special";
const TRASH_DAYS = 30;

async function defaultStateAsync(){
  const adminId = uid("acc"), dadId = uid("acc"), momId = uid("acc"), kidId = uid("acc");
  const accounts = [
    { id: adminId, name: "主管理者", role: "admin",  passwordHash: await sha256Hex("0000") },
    { id: dadId,   name: "爸爸",     role: "parent", passwordHash: await sha256Hex("1234") },
    { id: momId,   name: "媽媽",     role: "parent", passwordHash: await sha256Hex("1234") },
    { id: kidId,   name: "女兒",     role: "child",  passwordHash: await sha256Hex("1111") }
  ];
  return {
    accounts,
    dayTypes: [
      { id: DT_SCHOOL, name: "上學日", color:"#2E6BB0", steps: [
        {id:uid("st"), name:"起床", desc:"", points:1, type:"task", order:1},
        {id:uid("st"), name:"刷牙", desc:"", points:1, type:"task", order:2},
        {id:uid("st"), name:"穿襪子", desc:"", points:1, type:"task", order:3},
        {id:uid("st"), name:"穿鞋子", desc:"", points:1, type:"task", order:4}
      ]},
      { id: DT_HOLIDAY, name: "放假日", color:"#0E8074", steps: [
        {id:uid("st"), name:"電視時間 1H", desc:"當天可使用的自由時間，不需審核", points:0, type:"note", order:1}
      ]},
      { id: DT_BIRTHDAY, name: "生日", color:"#D6A93B", steps: [
        {id:uid("st"), name:"今天是生日，不用做例行任務", desc:"好好慶祝這一天", points:0, type:"note", order:1}
      ]},
      { id: DT_SPECIAL, name: "特殊日子", color:"#8A5FBF", steps: [] }
    ],
    dateAssignments: {},
    dayLog: {},
    rules: {
      extra: [
        {id:uid("r"), name:"專心做一件事5分鐘", desc:"拼圖、畫畫、積木不中斷", points:2, batch:"第二批"},
        {id:uid("r"), name:"主動幫忙", desc:"拿東西、擦桌子", points:1, batch:"第二批"},
        {id:uid("r"), name:"動一動", desc:"跳舞、追跑、丟球10分鐘", points:2, batch:"第二批"},
        {id:uid("r"), name:"說出感受", desc:"用說的代替哭鬧", points:2, batch:"第二批"},
        {id:uid("r"), name:"聽一次指令就做", desc:"不用講第二次", points:2, batch:"第二批"},
        {id:uid("r"), name:"分享／輪流", desc:"玩具、點心願意分", points:2, batch:"第二批"}
      ],
      deduction: [
        {id:uid("r"), name:"哭鬧不聽", desc:"平靜等她冷靜後才處理", points:1, batch:"第二批"},
        {id:uid("r"), name:"動手打人/推人", desc:"立即制止＋說明原因", points:2, batch:"第二批"},
        {id:uid("r"), name:"故意破壞物品", desc:"生氣摔東西", points:1, batch:"第二批"},
        {id:uid("r"), name:"說了3次仍不動作", desc:"先確認她有聽到、聽懂", points:1, batch:"第二批"}
      ],
      rewards: [
        {id:uid("r"), name:"選一集卡通", desc:"當天晚上看", points:3, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"貼紙變小圖案", desc:"畫在手背上", points:3, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"睡前多一本故事", desc:"爸媽多唸一本", points:5, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"公園玩久一點", desc:"多留15分鐘", points:8, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"小玩具/貼紙本", desc:"NT$100內自選", points:10, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"全家出去玩半天", desc:"動物園、遊樂園等", points:15, batch:"第二批", provider:"common"},
        {id:uid("r"), name:"一小時電視", desc:"全家共同獎勵", points:10, batch:"自訂", provider:"common"},
        {id:uid("r"), name:"減免三十分鐘抱抱睡", desc:"跟爸爸兌換", points:8, batch:"自訂", provider:dadId},
        {id:uid("r"), name:"親親抱抱三十秒，不生氣一次", desc:"跟媽媽兌換", points:8, batch:"自訂", provider:momId}
      ]
    },
    ledger: { [kidId]: [] },
    pendingTasks: [],
    pendingRedemptions: [],
    trash: []
  };
}

/* ---------------- Firestore 存取層 ---------------- */
async function loadState(){
  try{
    const snap = await getDoc(STATE_DOC);
    if(snap.exists()){ state = snap.data().payload ? JSON.parse(snap.data().payload) : await defaultStateAsync(); }
    else { state = await defaultStateAsync(); await saveState(); }
  }catch(e){
    console.error(e);
    state = await defaultStateAsync();
  }
  if(!state.dayTypes) state.dayTypes = (await defaultStateAsync()).dayTypes;
  if(!state.dateAssignments) state.dateAssignments = {};
  if(!state.dayLog) state.dayLog = {};
  if(!state.trash) state.trash = [];
  const migrated = await migrateAccountsIfNeeded();
  const purged = purgeExpiredTrash();
  if(migrated || purged) await saveState();
}

/* 舊版資料升級：補上密碼與主管理者角色，避免舊帳號被鎖在登入畫面外 */
async function migrateAccountsIfNeeded(){
  let changed = false;
  const hasAdmin = state.accounts.some(a=>a.role==="admin");
  if(!hasAdmin && state.accounts.length>0){
    state.accounts[0].role = "admin";
    changed = true;
  }
  for(const acc of state.accounts){
    if(!acc.passwordHash){
      const def = acc.role==="admin" ? "0000" : acc.role==="parent" ? "1234" : "1111";
      acc.passwordHash = await sha256Hex(def);
      changed = true;
    }
  }
  if(!Array.isArray(state.rules.rewards)) state.rules.rewards = [];
  state.rules.rewards.forEach(r=>{ if(!r.provider){ r.provider = "common"; changed = true; } });
  return changed;
}
async function saveState(){
  try{
    suppressNextSnapshot = true;
    await setDoc(STATE_DOC, { payload: JSON.stringify(state), updatedAt: Date.now() });
    isOnline = true;
  }catch(e){
    isOnline = false;
    showToast("儲存失敗，請檢查網路連線");
    console.error(e);
  }
}
function startRealtimeSync(){
  onSnapshot(STATE_DOC, (snap)=>{
    isOnline = true;
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(snap.exists() && snap.data().payload){
      state = JSON.parse(snap.data().payload);
      if(!state.dayTypes) state.dayTypes = [];
      if(!state.dateAssignments) state.dateAssignments = {};
      if(!state.dayLog) state.dayLog = {};
      if(!state.trash) state.trash = [];
      render();
    }
  }, (err)=>{ isOnline = false; console.error(err); render(); });
}
function loadSession(){ try{ const v = localStorage.getItem(SESSION_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function saveSession(){ try{ if(session) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }

/* ---------------- 垃圾桶 ---------------- */
function purgeExpiredTrash(){
  const cutoff = Date.now() - TRASH_DAYS*24*60*60*1000;
  const before = state.trash.length;
  state.trash = state.trash.filter(t=>t.deletedAt > cutoff);
  return state.trash.length !== before;
}
function daysLeftForTrash(t){ return Math.max(0, TRASH_DAYS - Math.floor((Date.now()-t.deletedAt)/86400000)); }

/* ---------------- 帳本輔助 ---------------- */
function getLedger(accId){ return state.ledger[accId] || []; }
function ensureLedger(accId){ if(!state.ledger[accId]) state.ledger[accId] = []; }
function sumLedger(accId){ return getLedger(accId).reduce((s,e)=> s + e.points, 0); }
function heldPoints(accId){ return state.pendingRedemptions.filter(r=> r.childId===accId && r.status==="held").reduce((s,r)=> s + r.points, 0); }
function availablePoints(accId){ return sumLedger(accId) - heldPoints(accId); }
function addLedgerEntry(accId, points, desc, meta){
  ensureLedger(accId);
  const actor = getAccount(currentAccountId);
  state.ledger[accId].push({ id: uid("tx"), ts: Date.now(), points, desc, meta: meta||"", actorId: currentAccountId||"", actorName: actor ? actor.name : "" });
}

/* ---------------- 日期／日型輔助 ---------------- */
function getDayType(id){ return state.dayTypes.find(d=>d.id===id); }
function getDayTypeIdForDate(dateStr){
  if(state.dateAssignments[dateStr]) return state.dateAssignments[dateStr];
  const wd = parseDateStr(dateStr).getDay();
  return (wd===0 || wd===6) ? DT_HOLIDAY : DT_SCHOOL;
}
function getStepLog(dateStr, childId, stepId){ return state.dayLog[dateStr] && state.dayLog[dateStr][childId] ? state.dayLog[dateStr][childId][stepId] : undefined; }
function setStepLog(dateStr, childId, stepId, entry){
  if(!state.dayLog[dateStr]) state.dayLog[dateStr] = {};
  if(!state.dayLog[dateStr][childId]) state.dayLog[dateStr][childId] = {};
  state.dayLog[dateStr][childId][stepId] = entry;
}
function dateHasIncomplete(dateStr, childId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  if(!dt) return false;
  if(dateStr >= todayStr()) return false;
  return dt.steps.some(s=> s.type==="task" && (!getStepLog(dateStr, childId, s.id) || getStepLog(dateStr, childId, s.id).status==="rejected"));
}

/* ---------------- UI 輔助 ---------------- */
function showToast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(showToast._h); showToast._h = setTimeout(()=> t.classList.remove("show"), 2200); }
function fmtTime(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDateFull(dateStr){ const d = parseDateStr(dateStr); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${WEEKDAY_LABELS[d.getDay()]}`; }
function getAccount(id){ return state.accounts.find(a=>a.id===id); }
function currentAccount(){ return getAccount(currentAccountId); }
function sessionAccount(){ return session ? getAccount(session.accountId) : null; }
function children(){ return state.accounts.filter(a=>a.role==="child"); }
function parents(){ return state.accounts.filter(a=>a.role==="parent"); }
function roleLabel(r){ return r==="admin"?"主管理者":r==="parent"?"家長":"寶貝"; }
async function persistAndRender(){ await saveState(); render(); }

/* ---------------- 登入／登出／管理者切換 ---------------- */
async function attemptLogin(accountId, passwordPlain){
  const acc = getAccount(accountId);
  if(!acc){ loginError = "找不到這個帳號"; render(); return; }
  const hash = await sha256Hex(passwordPlain || "");
  if(hash !== acc.passwordHash){ loginError = "密碼錯誤，請再試一次"; render(); return; }
  loginError = "";
  session = { accountId };
  saveSession();
  currentAccountId = accountId;
  activeTab = "home";
  childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  selectedDate = todayStr();
  calMonth = new Date();
  render();
}
function logout(){
  session = null; saveSession();
  currentAccountId = null; loginError = "";
  render();
}
async function adminActAs(accountId){
  if(!session) return;
  session.actingAs = accountId;
  saveSession();
  currentAccountId = accountId;
  activeTab = "home";
  const acc = getAccount(accountId);
  childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  selectedDate = todayStr(); calMonth = new Date();
  render();
}
function adminReturnToSelf(){
  if(!session) return;
  delete session.actingAs;
  saveSession();
  currentAccountId = session.accountId;
  activeTab = "home";
  childViewFilter = children()[0] ? children()[0].id : null;
  render();
}
async function changePassword(accountId, newPlain){
  if(!newPlain || newPlain.length < 2){ showToast("密碼至少需要2個字元"); return; }
  const acc = getAccount(accountId); if(!acc) return;
  acc.passwordHash = await sha256Hex(newPlain);
  showToast(`已更新「${acc.name}」的密碼`);
  await persistAndRender();
}

/* ---------------- 事件：日曆步驟回報／審核 ---------------- */
async function submitStep(dateStr, childId, stepId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  const step = dt.steps.find(s=>s.id===stepId); if(!step) return;
  setStepLog(dateStr, childId, stepId, {status:"pending", ts: Date.now()});
  showToast(`已送出「${step.name}」，等待審核`);
  await persistAndRender();
}
async function approveStep(dateStr, childId, stepId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  const step = dt.steps.find(s=>s.id===stepId); if(!step) return;
  const already = getStepLog(dateStr, childId, stepId);
  if(already && already.status==="approved") return;
  setStepLog(dateStr, childId, stepId, {status:"approved", ts: Date.now()});
  if(step.points) addLedgerEntry(childId, step.points, `${dt.name}｜${step.name}`, dateStr);
  showToast(`已核准「${step.name}」`);
  await persistAndRender();
}
async function rejectStep(dateStr, childId, stepId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  const step = dt.steps.find(s=>s.id===stepId); if(!step) return;
  setStepLog(dateStr, childId, stepId, {status:"rejected", ts: Date.now()});
  showToast(`已標記「${step.name}」未完成`);
  await persistAndRender();
}
async function approveAllSteps(dateStr, childId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  let n = 0;
  dt.steps.filter(s=>s.type==="task").forEach(s=>{
    const log = getStepLog(dateStr, childId, s.id);
    if(log && log.status==="pending"){
      setStepLog(dateStr, childId, s.id, {status:"approved", ts: Date.now()});
      if(s.points) addLedgerEntry(childId, s.points, `${dt.name}｜${s.name}`, dateStr);
      n++;
    }
  });
  showToast(n>0 ? `已核准 ${n} 項` : "沒有待審核的項目");
  await persistAndRender();
}
async function setDateAssignment(dateStr, dayTypeId){
  if(dayTypeId){ state.dateAssignments[dateStr] = dayTypeId; } else { delete state.dateAssignments[dateStr]; }
  showToast("已更新這天的日期類型");
  await persistAndRender();
}

/* ---------------- 點數：加點／扣點 ---------------- */
async function grantPoints(childId, points, desc){
  const p = Number(points);
  if(!p || p<=0){ showToast("請輸入大於0的點數"); return; }
  if(!childId){ showToast("請先選擇孩子"); return; }
  addLedgerEntry(childId, p, (desc && desc.trim()) || "家長加點", "手動加點");
  showToast(`已加 ${p} 點`);
  await persistAndRender();
}
async function applyDeduction(childId, ruleId){
  const rule = state.rules.deduction.find(r=>r.id===ruleId); if(!rule) return;
  addLedgerEntry(childId, -Math.abs(rule.points), rule.name, "家長扣點");
  showToast(`已扣除「${rule.name}」-${Math.abs(rule.points)}點`);
  await persistAndRender();
}

/* ---------------- 其他事件 ---------------- */
async function submitExtra(ruleId){
  const rule = state.rules.extra.find(r=>r.id===ruleId); if(!rule) return;
  state.pendingTasks.push({ id: uid("pt"), childId: currentAccountId, ruleId, ruleName: rule.name, points: rule.points, ts: Date.now(), status:"pending" });
  showToast(`已送出「${rule.name}」，等待審核`);
  await persistAndRender();
}
async function approveTask(taskId){
  const t = state.pendingTasks.find(x=>x.id===taskId); if(!t || t.status!=="pending") return;
  t.status = "approved"; addLedgerEntry(t.childId, t.points, t.ruleName, "額外活動核准");
  showToast(`已核准「${t.ruleName}」+${t.points}點`);
  await persistAndRender();
}
async function rejectTask(taskId){
  const t = state.pendingTasks.find(x=>x.id===taskId); if(!t || t.status!=="pending") return;
  t.status = "rejected"; showToast(`已拒絕「${t.ruleName}」`);
  await persistAndRender();
}
async function approveAllTasks(childId){
  const list = state.pendingTasks.filter(t=>t.childId===childId && t.status==="pending");
  list.forEach(t=>{ t.status = "approved"; addLedgerEntry(t.childId, t.points, t.ruleName, "額外活動核准（全部核准）"); });
  showToast(`已全部核准 ${list.length} 項`);
  await persistAndRender();
}
async function requestRedeem(rewardId){
  const rule = state.rules.rewards.find(r=>r.id===rewardId); if(!rule) return;
  if(availablePoints(currentAccountId) < rule.points){ showToast("點數不足，還不能兌換這個獎勵"); return; }
  state.pendingRedemptions.push({ id: uid("pr"), childId: currentAccountId, rewardId, rewardName: rule.name, provider: rule.provider||"common", points: rule.points, ts: Date.now(), status:"held" });
  showToast(`「${rule.name}」已送出兌換申請，點數先移入保留區`);
  await persistAndRender();
}
async function completeRedeem(redId){
  const r = state.pendingRedemptions.find(x=>x.id===redId); if(!r || r.status!=="held") return;
  r.status = "completed"; addLedgerEntry(r.childId, -r.points, r.rewardName, "兌換完成扣點");
  showToast(`已完成兌換「${r.rewardName}」，扣除${r.points}點`);
  await persistAndRender();
}
async function cancelRedeem(redId){
  const r = state.pendingRedemptions.find(x=>x.id===redId); if(!r || r.status!=="held") return;
  r.status = "cancelled"; showToast(`已取消兌換「${r.rewardName}」，點數退回可用餘額`);
  await persistAndRender();
}
async function addAccount(name, role, passwordPlain){
  if(!name || !name.trim()) return;
  const acc = { id: uid("acc"), name: name.trim(), role, passwordHash: await sha256Hex(passwordPlain || "0000") };
  state.accounts.push(acc);
  if(role==="child") ensureLedger(acc.id);
  showToast(`已新增帳號「${acc.name}」`);
  await persistAndRender();
}
async function removeAccount(accId){
  if(session && (accId===session.accountId || accId===currentAccountId)){ showToast("無法刪除目前登入中的帳號"); return; }
  state.accounts = state.accounts.filter(a=>a.id!==accId);
  showToast("已刪除帳號（歷史帳本仍保留）");
  await persistAndRender();
}
async function addRule(type, name, desc, points, batch, provider){
  if(!name || !name.trim()) return;
  const item = { id: uid("r"), name: name.trim(), desc: (desc||"").trim(), points: Number(points)||0, batch: batch||"自訂" };
  if(type==="rewards") item.provider = provider || "common";
  state.rules[type].push(item);
  showToast("已新增規則");
  await persistAndRender();
}
async function removeRule(type, ruleId){
  const item = state.rules[type].find(r=>r.id===ruleId); if(!item) return;
  state.rules[type] = state.rules[type].filter(r=>r.id!==ruleId);
  state.trash.push({ id: uid("tr"), kind:"rule", subtype:type, payload:item, deletedAt: Date.now() });
  showToast("已移到垃圾桶（30天內可復原）");
  await persistAndRender();
}
async function addDayTypeStep(dayTypeId, name, points, type){
  const dt = getDayType(dayTypeId); if(!dt || !name || !name.trim()) return;
  dt.steps.push({ id: uid("st"), name: name.trim(), desc:"", points: Number(points)||0, type: type||"task", order: dt.steps.length+1 });
  showToast("已新增步驟");
  await persistAndRender();
}
async function removeDayTypeStep(dayTypeId, stepId){
  const dt = getDayType(dayTypeId); if(!dt) return;
  const item = dt.steps.find(s=>s.id===stepId); if(!item) return;
  dt.steps = dt.steps.filter(s=>s.id!==stepId);
  state.trash.push({ id: uid("tr"), kind:"daytype_step", subtype:dayTypeId, payload:item, deletedAt: Date.now() });
  showToast("已移到垃圾桶（30天內可復原）");
  await persistAndRender();
}
async function addDayType(name){
  if(!name || !name.trim()) return;
  state.dayTypes.push({ id: uid("dt"), name: name.trim(), color:"#6B7A8F", steps: [] });
  showToast("已新增日期類型");
  await persistAndRender();
}
async function restoreTrashItem(trashId){
  const idx = state.trash.findIndex(t=>t.id===trashId); if(idx<0) return;
  const t = state.trash[idx];
  if(t.kind==="rule"){ state.rules[t.subtype].push(t.payload); }
  else if(t.kind==="daytype_step"){
    const dt = getDayType(t.subtype);
    if(!dt){ showToast("原本的日期類型已不存在，無法復原"); return; }
    dt.steps.push(t.payload);
  }
  state.trash.splice(idx,1);
  showToast("已復原");
  await persistAndRender();
}
async function permanentlyDeleteTrash(trashId){
  state.trash = state.trash.filter(t=>t.id!==trashId);
  showToast("已永久刪除");
  await persistAndRender();
}

/* ---------------- 主渲染 ---------------- */

  const acc = currentAccount();

  const sAcc = sessionAccount();
  const isAdminSession = sAcc && sAcc.role === "admin";
  const isImpersonating = isAdminSession && session.actingAs && session.actingAs !== session.accountId;
  const isChild = acc.role === "child";
  const avail = isChild ? availablePoints(acc.id) : null;
  const held = isChild ? heldPoints(acc.id) : null;

  let html = "";
  html += `<header class="top">
    <div class="brand">
      <div class="brand-left"><div class="mark">⭐</div><div><h1>星星銀行</h1><div class="sub">家庭點數系統</div></div></div>
      <button class="logout-btn" data-action="logout">登出</button>
    </div>
    <div class="sync-dot ${isOnline?"":"offline"}"><span class="d"></span>${isOnline? "已連線・即時同步" : "離線中，變更暫存本機"}</div>
    <div class="account-row">
      <span class="role-pill ${acc.role}">${acc.name}・${roleLabel(acc.role)}</span>
    </div>`;

  if(isAdminSession && !isImpersonating){
    html += `<div class="account-row">
      <select class="acct-select" id="actAsSelect">
        <option value="">切換身份查看／管理其他帳號…</option>
        ${state.accounts.filter(a=>a.id!==sAcc.id).map(a=>`<option value="${a.id}">${a.name}（${roleLabel(a.role)}）</option>`).join("")}
      </select>
    </div>`;
  }
  if(isImpersonating){
    html += `<div class="impersonate-banner"><span>管理者檢視中：目前以「${acc.name}」身份操作</span><button data-action="adminReturn">返回管理者</button></div>`;
  }

  if(isChild){
    html += `<div class="balance-strip">
      <div class="bal-box avail"><div class="label">可用點數</div><div class="num">${avail} ⭐</div></div>
      <div class="bal-box held"><div class="label">保留中（兌換審核）</div><div class="num">${held} 🔒</div></div>
    </div>`;
  }
  html += `</header>`;

  const isAdminOwnDashboard = acc.role === "admin";
  const tabs = isChild
    ? [["home","首頁"],["extra","額外活動"],["shop","兌換商店"],["ledger","我的紀錄"]]
    : [["home","日曆"],["review","待審核"],["points","點數調整"],["daytypes","日期類型"],["rules","規則管理"],["trash","垃圾桶"],["overview","家庭總覽"]].concat(isAdminOwnDashboard ? [["accounts","帳戶管理"]] : []);
  if(!activeTab) activeTab = "home";

  html += `<nav class="tabs">${tabs.map(([k,l])=>{
    let badge = "";
    if(!isChild && k==="review"){
      const n = state.pendingTasks.filter(t=>t.status==="pending").length + state.pendingRedemptions.filter(r=>r.status==="held").length + countPendingSteps();
      if(n>0) badge = ` <span class="pending-badge">●${n}</span>`;
    }
    if(!isChild && k==="trash" && state.trash.length>0) badge = ` <span class="pending-badge">${state.trash.length}</span>`;
    return `<button class="${activeTab===k?"active":""}" data-tab="${k}">${l}${badge}</button>`;
  }).join("")}</nav>`;

  html += `<main>`;
  if(isChild){
    if(activeTab==="home") html += renderCalendarSection(acc, false);
    else if(activeTab==="extra") html += renderExtraTab(acc);
    else if(activeTab==="shop") html += renderShopTab(acc);
    else if(activeTab==="ledger") html += renderLedgerTab(acc);
  } else {
    if(activeTab==="home") html += renderCalendarSection(acc, true);
    else if(activeTab==="review") html += renderReviewTab();
    else if(activeTab==="points") html += renderPointsTab();
    else if(activeTab==="daytypes") html += renderDayTypesTab();
    else if(activeTab==="rules") html += renderRulesTab();
    else if(activeTab==="trash") html += renderTrashTab();
    else if(activeTab==="accounts") html += renderAccountsTab();
    else if(activeTab==="overview") html += renderOverviewTab();
  }
  html += `</main>`;
  app.innerHTML = html;
  bindEvents();
}

function renderLoginScreen(){
  const options = state.accounts.map(a=>`<option value="${a.id}">${a.name}（${roleLabel(a.role)}）</option>`).join("");
  return `<div class="login-wrap"><div class="login-card">
    <div class="mark">⭐</div>
    <h1>星星銀行</h1>
    <div class="sub">請選擇帳號並輸入密碼登入</div>
    <div class="form-grid full"><div><label class="f-label">帳號</label><select class="field" id="loginAccount">${options}</select></div></div>
    <div class="form-grid full"><div><label class="f-label">密碼</label><input type="password" id="loginPassword" placeholder="請輸入密碼"></div></div>
    ${loginError ? `<div style="color:var(--coral);font-size:12.5px;margin-bottom:8px;font-weight:700;">${loginError}</div>` : ""}
    <button class="btn primary" style="width:100%;padding:11px;" data-action="doLogin">登入</button>
  </div></div>`;
}
function bindLoginEvents(){
  const btn = document.querySelector('[data-action="doLogin"]');
  if(btn) btn.addEventListener("click", async ()=>{
    const accId = document.getElementById("loginAccount").value;
    const pw = document.getElementById("loginPassword").value;
    await attemptLogin(accId, pw);
  });
  const pwInput = document.getElementById("loginPassword");
  if(pwInput) pwInput.addEventListener("keydown", async (e)=>{ if(e.key==="Enter"){ const accId = document.getElementById("loginAccount").value; await attemptLogin(accId, pwInput.value); } });
}

function countPendingSteps(){
  return getPendingCalendarSteps().length;
}
function getPendingCalendarSteps(){
  const list = [];
  Object.keys(state.dayLog).forEach(date=>{
    Object.keys(state.dayLog[date]).forEach(childId=>{
      Object.keys(state.dayLog[date][childId]).forEach(stepId=>{
        const log = state.dayLog[date][childId][stepId];
        if(log.status!=="pending") return;
        const dt = getDayType(getDayTypeIdForDate(date));
        const step = dt ? dt.steps.find(s=>s.id===stepId) : null;
        list.push({
          date, childId, stepId,
          stepName: step ? step.name : "（項目已刪除）",
          points: step ? step.points : 0,
          dayTypeName: dt ? dt.name : "",
          ts: log.ts
        });
      });
    });
  });
  list.sort((a,b)=> a.date===b.date ? a.ts-b.ts : (a.date < b.date ? -1 : 1));
  return list;
}
async function approveAllPendingStepsForChild(childId){
  const items = getPendingCalendarSteps().filter(i=>i.childId===childId);
  let n = 0;
  items.forEach(i=>{
    const dt = getDayType(getDayTypeIdForDate(i.date));
    const step = dt ? dt.steps.find(s=>s.id===i.stepId) : null;
    setStepLog(i.date, i.childId, i.stepId, {status:"approved", ts: Date.now()});
    if(step && step.points) addLedgerEntry(i.childId, step.points, `${dt.name}｜${step.name}`, i.date);
    n++;
  });
  showToast(n>0 ? `已核准 ${n} 項日曆任務` : "沒有待審核的日曆任務");
  await persistAndRender();
}

/* ---------------- 日曆區塊 ---------------- */
function renderCalendarSection(acc, isParentView){
  if(!calMonth) calMonth = new Date();
  if(!selectedDate) selectedDate = todayStr();
  const targetChildId = isParentView ? (childViewFilter || (children()[0] && children()[0].id)) : acc.id;
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = `${y}年 ${m+1}月`;

  let html = `<div class="card">`;
  if(isParentView && children().length>1){
    html += `<div class="child-tab-select">${children().map(k=>`<button data-action="setChildFilter" data-id="${k.id}" class="${targetChildId===k.id?"active":""}">${k.name}</button>`).join("")}</div>`;
  }
  html += `<div class="cal-head"><div class="cal-title">${monthLabel}</div>
      <div class="cal-nav"><button data-action="calPrev">‹</button><button class="today-btn" data-action="calToday">今天</button><button data-action="calNext">›</button></div>
    </div>
    <div class="weekday-row">${WEEKDAY_LABELS.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-grid">`;
  for(let i=0;i<startWeekday;i++) html += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const dtId = getDayTypeIdForDate(dateStr);
    const dt = getDayType(dtId);
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === selectedDate;
    const incomplete = targetChildId ? dateHasIncomplete(dateStr, targetChildId) : false;
    html += `<div class="cal-cell ${isToday?"today":""} ${isSelected?"selected":""} ${incomplete?"incomplete-mark":""}" data-action="selectDate" data-date="${dateStr}">
      <div class="dnum">${d}</div><div class="dot" style="background:${dt?dt.color:'#999'}"></div></div>`;
  }
  html += `</div>`;
  html += `<div class="daytype-legend">${state.dayTypes.map(dt=>`<span><span class="dot" style="background:${dt.color}"></span>${dt.name}</span>`).join("")}${isParentView?'<span>！ 紅色驚嘆號 ＝ 過去有未完成項目</span>':''}</div></div>`;
  html += renderDateDetail(selectedDate, targetChildId, isParentView);
  return html;
}
function renderDateDetail(dateStr, childId, isParentView){
  const dtId = getDayTypeIdForDate(dateStr);
  const dt = getDayType(dtId);
  const isToday = dateStr === todayStr();
  const isPast = dateStr < todayStr();
  const isFuture = dateStr > todayStr();
  let html = `<div class="card"><div class="date-detail-head"><div class="ddate">${fmtDateFull(dateStr)} ${isToday?"（今天）":""}</div></div>`;
  if(isParentView){
    html += `<div class="form-grid full" style="margin-bottom:10px;"><div><label class="f-label">這天的日期類型</label>
        <select class="field" data-action="changeDateType" data-date="${dateStr}">
          <option value="">（依平日/假日自動判斷：目前為 ${dt?dt.name:"未設定"}）</option>
          ${state.dayTypes.map(d=>`<option value="${d.id}" ${state.dateAssignments[dateStr]===d.id?"selected":""}>${d.name}</option>`).join("")}
        </select></div></div>`;
  } else {
    html += `<div class="section-tag">今日類型：<span class="batch-tag b2" style="margin-left:0;">${dt?dt.name:""}</span></div>`;
  }
  if(!dt || (dt.steps.length===0)){ html += `<div class="empty">這天還沒有設定任何項目</div></div>`; return html; }
  if(!childId){ html += `<div class="empty">尚未選擇孩子帳號</div></div>`; return html; }

  dt.steps.slice().sort((a,b)=>a.order-b.order).forEach(step=>{
    if(step.type==="note"){ html += `<div class="note-card">📌 ${step.name}${step.desc?`｜${step.desc}`:""}</div>`; return; }
    const log = getStepLog(dateStr, childId, step.id);
    let chip = "", actionBtns = "";
    if(log && log.status==="approved"){ chip = `<span class="status-chip done">已完成</span>`; }
    else if(log && log.status==="pending"){
      chip = `<span class="status-chip pending">審核中</span>`;
      if(isParentView) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">核准</button>
        <button class="btn coral" data-action="rejectStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">拒絕</button>`;
    } else if(log && log.status==="rejected"){
      chip = `<span class="status-chip missing">未完成</span>`;
      if(!isParentView && isToday) actionBtns = `<button class="btn primary" data-action="submitStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">重新回報</button>`;
      if(isParentView) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">補登完成</button>`;
    } else {
      if(isFuture){ chip = `<span class="status-chip future">尚未到</span>`; }
      else if(isPast){ chip = `<span class="status-chip missing">未完成</span>`; }
      else { chip = `<span class="status-chip pending">待完成</span>`; }
      if(!isParentView && isToday) actionBtns = `<button class="btn primary" data-action="submitStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">我做到了</button>`;
      if(isParentView && !isFuture) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">補登完成</button>`;
    }
    html += `<div class="task-item"><div class="t-main"><div class="t-name">${step.name}</div>${step.desc?`<div class="t-desc">${step.desc}</div>`:""}</div>
      <div class="btn-row">${step.points? `<span class="pts pos">+${step.points}</span>` : `<span class="pts neutral">無點數</span>`}${chip}${actionBtns}</div></div>`;
  });
  if(isParentView){
    const hasPending = dt.steps.some(s=>{ const l=getStepLog(dateStr, childId, s.id); return l && l.status==="pending"; });
    if(hasPending) html += `<button class="btn teal" style="margin-top:6px;" data-action="approveAllSteps" data-date="${dateStr}" data-child="${childId}">全部核准</button>`;
  }
  html += `</div>`;
  return html;
}

      <div><label class="f-label">姓名</label><input type="text" id="new_acc_name" placeholder="例如：奶奶"></div>
      <div><label class="f-label">角色</label><select class="field" id="new_acc_role"><option value="parent">家長</option><option value="child">孩子</option><option value="admin">主管理者</option></select></div></div>
    <div class="form-grid full"><div><label class="f-label">初始密碼</label><input type="password" id="new_acc_password" placeholder="設定登入密碼"></div></div>
    <button class="btn primary" data-action="addAccount">新增帳號</button><div class="divider"></div>
    <small class="hint">只有主管理者能看到這一頁。每個帳號都需要密碼登入；一般帳號登入後無法切換身份，只能登出重新登入；主管理者可直接切換查看／管理任何帳號。</small></div>`;
  return html;
}
function renderOverviewTab(){
  const kids = children();
  if(kids.length===0) return `<div class="card"><div class="empty">尚未新增孩子帳號</div></div>`;
  let html = "";
  kids.forEach(k=>{
    const avail = availablePoints(k.id), held = heldPoints(k.id);
    const entries = getLedger(k.id).slice().sort((a,b)=>b.ts-a.ts).slice(0,6);
    html += `<div class="card"><h2>${k.name} 的帳戶</h2>
      <div class="balance-strip" style="margin-bottom:12px;">
        <div class="bal-box avail" style="background:var(--teal-soft);"><div class="label" style="color:var(--teal)">可用點數</div><div class="num" style="color:var(--teal)">${avail} ⭐</div></div>
        <div class="bal-box held" style="background:var(--gold-soft);"><div class="label" style="color:#7A5312">保留中</div><div class="num" style="color:#7A5312">${held} 🔒</div></div>
      </div><div class="section-tag">最近紀錄</div>`;
    if(entries.length===0) html += `<div class="empty">還沒有任何紀錄</div>`;
    entries.forEach(e=>{
      html += `<div class="ledger-row"><div><div class="l-desc">${e.desc}</div><div class="l-meta">${fmtTime(e.ts)}${e.actorName?`｜來源：${e.actorName}`:""}</div></div><div class="l-amt ${e.points>=0?"pos":"neg"}">${e.points>=0?"+":""}${e.points}</div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ---------------- 事件綁定 ---------------- */
function bindEvents(){
  const actAsSelect = document.getElementById("actAsSelect");
  if(actAsSelect) actAsSelect.addEventListener("change", async (e)=>{ if(e.target.value) await adminActAs(e.target.value); });

  document.querySelectorAll("nav.tabs button").forEach(btn=>{ btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; render(); }); });
  const dtSelect = document.querySelector('[data-action="changeDateType"]');
  if(dtSelect) dtSelect.addEventListener("change", async (e)=>{ await setDateAssignment(e.target.dataset.date, e.target.value); });

  document.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.dataset.action;
    if(action==="changeDateType") return;
    el.addEventListener("click", async ()=>{
      try{
        if(action==="logout"){ logout(); return; }
        if(action==="adminReturn"){ adminReturnToSelf(); return; }
        if(action==="selectDate"){ selectedDate = el.dataset.date; render(); return; }
        if(action==="calPrev"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); return; }
        if(action==="calNext"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); return; }
        if(action==="calToday"){ calMonth = new Date(); selectedDate = todayStr(); render(); return; }
        if(action==="setChildFilter"){ childViewFilter = el.dataset.id; render(); return; }

        if(action==="submitStep") await submitStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="approveStep") await approveStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="rejectStep") await rejectStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="approveAllSteps") await approveAllSteps(el.dataset.date, el.dataset.child);
        else if(action==="approveAllStepsForChild") await approveAllPendingStepsForChild(el.dataset.id);
        else if(action==="submitExtra") await submitExtra(el.dataset.id);
        else if(action==="approveTask") await approveTask(el.dataset.id);
        else if(action==="rejectTask") await rejectTask(el.dataset.id);
        else if(action==="approveAllTasks") await approveAllTasks(el.dataset.id);
        else if(action==="applyDeduction") await applyDeduction(el.dataset.child, el.dataset.id);
        else if(action==="grantPoints"){
          const desc = document.getElementById("grant_desc").value;
          const points = document.getElementById("grant_points").value;
          await grantPoints(el.dataset.child, points, desc);
        }
        else if(action==="requestRedeem") await requestRedeem(el.dataset.id);
        else if(action==="completeRedeem") await completeRedeem(el.dataset.id);
        else if(action==="cancelRedeem") await cancelRedeem(el.dataset.id);
        else if(action==="removeAccount") await removeAccount(el.dataset.id);
        else if(action==="resetPassword"){
          const pw = document.getElementById(`pw_${el.dataset.id}`).value;
          await changePassword(el.dataset.id, pw);
        }
        else if(action==="removeRule") await removeRule(el.dataset.type, el.dataset.id);
        else if(action==="removeDayTypeStep") await removeDayTypeStep(el.dataset.daytype, el.dataset.id);
        else if(action==="restoreTrash") await restoreTrashItem(el.dataset.id);
        else if(action==="permDeleteTrash") await permanentlyDeleteTrash(el.dataset.id);
        else if(action==="addDayType"){ const v = document.getElementById("new_daytype_name").value; await addDayType(v); }
        else if(action==="addDayTypeStep"){
          const dtId = el.dataset.daytype;
          const name = document.getElementById(`new_step_${dtId}_name`).value;
          const points = document.getElementById(`new_step_${dtId}_points`).value;
          const type = document.getElementById(`new_step_${dtId}_type`).value;
          await addDayTypeStep(dtId, name, points, type);
        }
        else if(action==="addAccount"){
          const name = document.getElementById("new_acc_name").value;
          const role = document.getElementById("new_acc_role").value;
          const pw = document.getElementById("new_acc_password").value;
          await addAccount(name, role, pw);
        }
        else if(action==="addRule"){
          const type = el.dataset.type;
          const name = document.getElementById(`new_${type}_name`).value;
          const points = document.getElementById(`new_${type}_points`).value;
          const desc = document.getElementById(`new_${type}_desc`).value;
          await addRule(type, name, desc, points, "自訂");
        }
        else if(action==="addRewardRule"){
          const name = document.getElementById("new_rewards_name").value;
          const points = document.getElementById("new_rewards_points").value;
          const desc = document.getElementById("new_rewards_desc").value;
          const provider = document.getElementById("new_rewards_provider").value;
          await addRule("rewards", name, desc, points, "自訂", provider);
        }
      }catch(err){ showToast("操作失敗，請再試一次"); console.error(err); }
    });
  });
}

/* ---------------- 初始化 ---------------- */
async function init(){
  await loadState();
  startRealtimeSync();
  session = loadSession();
  if(session && getAccount(session.accountId)){
    currentAccountId = session.actingAs && getAccount(session.actingAs) ? session.actingAs : session.accountId;
    activeTab = "home";
    const acc = currentAccount();
    childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  } else {
    session = null;
  }
  calMonth = new Date();
  selectedDate = todayStr();
  render();
}
init();
</script>
