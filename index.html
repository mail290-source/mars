/* ---------------- 密碼雜湊 ---------------- */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 160;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Firestore 存取層 ---------------- */
async function loadState(){
  try{
    const snap = await getDoc(STATE_DOC);
    if(snap.exists()){ state = snap.data().payload ? JSON.parse(snap.data().payload) : await defaultStateAsync(); }
    else { state = await defaultStateAsync(); await saveState(); }
  }catch(e){
    console.error(e);
    state = await defaultStateAsync();
  }
  if(!state.dayTypes) state.dayTypes = (await defaultStateAsync()).dayTypes;
  if(!state.dateAssignments) state.dateAssignments = {};
  if(!state.dayLog) state.dayLog = {};
  if(!state.trash) state.trash = [];
  const migratedAcc = await migrateAccountsIfNeeded();
  const migratedCur = migrateCurrencyIfNeeded();
  const migratedIcons = migrateIconsIfNeeded();
  const purged = purgeExpiredTrash();
  if(migratedAcc || migratedCur || migratedIcons || purged) await saveState();
}
async function saveState(){
  try{
    suppressNextSnapshot = true;
    await setDoc(STATE_DOC, { payload: JSON.stringify(state), updatedAt: Date.now() });
    isOnline = true;
  }catch(e){
    isOnline = false;
    showToast("儲存失敗，請檢查網路連線");
    console.error(e);
  }
}
function startRealtimeSync(){
  onSnapshot(STATE_DOC, (snap)=>{
    isOnline = true;
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(snap.exists() && snap.data().payload){
      state = JSON.parse(snap.data().payload);
      if(!state.dayTypes) state.dayTypes = [];
      if(!state.dateAssignments) state.dateAssignments = {};
      if(!state.dayLog) state.dayLog = {};
      if(!state.trash) state.trash = [];
      render();
    }
  }, (err)=>{ isOnline = false; console.error(err); render(); });
}

/* ---------------- 升級遷移 ---------------- */
async function migrateAccountsIfNeeded(){
  let changed = false;
  const hasAdmin = state.accounts.some(a=>a.role==="admin");
  if(!hasAdmin && state.accounts.length>0){ state.accounts[0].role = "admin"; changed = true; }
  for(const acc of state.accounts){
    if(!acc.passwordHash){
      const def = acc.role==="admin" ? "0000" : acc.role==="parent" ? "1234" : "1111";
      acc.passwordHash = await sha256Hex(def);
      changed = true;
    }
  }
  return changed;
}
function migrateCurrencyIfNeeded(){
  let changed = false;
  if(!state.currencies){ state.currencies = [{id:CUR_GENERAL,name:"銅星",symbol:"⭐"},{id:CUR_SPECIAL,name:"金星",symbol:"🌟"}]; changed = true; }
  if(state.exchangeRate == null){ state.exchangeRate = 100; changed = true; }
  ["extra","deduction"].forEach(type=>{
    state.rules[type].forEach(r=>{ if(!r.currency){ r.currency = CUR_GENERAL; changed = true; } });
  });
  state.dayTypes.forEach(dt=>{
    dt.steps.forEach(s=>{ if(!s.currency){ s.currency = CUR_GENERAL; changed = true; } });
  });
  if(!Array.isArray(state.rules.rewards)) state.rules.rewards = [];
  state.rules.rewards.forEach(r=>{
    if(!r.costs){ r.costs = { general: r.points||0, special: 0 }; delete r.points; changed = true; }
    if(!r.providers){ r.providers = r.provider ? (r.provider==="common"?["common"]:[r.provider]) : ["common"]; delete r.provider; changed = true; }
  });
  Object.keys(state.ledger).forEach(cid=>{
    state.ledger[cid].forEach(e=>{ if(!e.currency){ e.currency = CUR_GENERAL; changed = true; } });
  });
  state.pendingTasks.forEach(t=>{ if(!t.currency){ t.currency = CUR_GENERAL; changed = true; } });
  state.pendingRedemptions.forEach(r=>{
    if(!r.costs){ r.costs = { general: r.points||0, special: 0 }; delete r.points; changed = true; }
  });
  return changed;
}

    "聽一次指令就做":"👂", "分享／輪流":"🤲",
    "哭鬧不聽":"😢", "動手打人/推人":"✋", "故意破壞物品":"💥", "說了3次仍不動作":"📢",
    "選一集卡通":"📺", "貼紙變小圖案":"⭐", "睡前多一本故事":"📖", "公園玩久一點":"🌳",
    "小玩具/貼紙本":"🧸", "全家出去玩半天":"🏞️", "一小時電視":"📺",
    "減免三十分鐘抱抱睡":"🤗", "親親抱抱三十秒，不生氣一次":"😘"
  };
  ["extra","deduction","rewards"].forEach(type=>{
    state.rules[type].forEach(r=>{ if(!r.icon){ r.icon = nameIconMap[r.name] || (type==="rewards"?"🎁":"⭐"); changed = true; } });
  });
  state.dayTypes.forEach(dt=>{
    dt.steps.forEach(s=>{ if(!s.icon){ s.icon = nameIconMap[s.name] || "⭐"; changed = true; } });
  });
  return changed;
}

/* ---------------- 垃圾桶 ---------------- */
function purgeExpiredTrash(){
  const cutoff = Date.now() - TRASH_DAYS*24*60*60*1000;
  const before = state.trash.length;
  state.trash = state.trash.filter(t=>t.deletedAt > cutoff);
  return state.trash.length !== before;
}
function daysLeftForTrash(t){ return Math.max(0, TRASH_DAYS - Math.floor((Date.now()-t.deletedAt)/86400000)); }

/* ---------------- 貨幣輔助 ---------------- */
function curMeta(id){ return state.currencies.find(c=>c.id===id) || {id, name:id, symbol:"⭐"}; }

/* ---------------- 帳本輔助（雙貨幣） ---------------- */
function getLedger(accId){ return state.ledger[accId] || []; }
function ensureLedger(accId){ if(!state.ledger[accId]) state.ledger[accId] = []; }
function sumLedger(accId, currency){ return getLedger(accId).filter(e=>(e.currency||CUR_GENERAL)===currency).reduce((s,e)=> s + e.points, 0); }
function heldPoints(accId, currency){
  return state.pendingRedemptions.filter(r=> r.childId===accId && r.status==="held").reduce((s,r)=> s + ((r.costs && r.costs[currency]) || 0), 0);
}
function availablePoints(accId, currency){ return sumLedger(accId, currency) - heldPoints(accId, currency); }
function addLedgerEntry(accId, points, desc, meta, currency){
  ensureLedger(accId);
  const actor = getAccount(currentAccountId);
  state.ledger[accId].push({ id: uid("tx"), ts: Date.now(), points, desc, meta: meta||"", currency: currency||CUR_GENERAL, actorId: currentAccountId||"", actorName: actor ? actor.name : "" });
}
function canAffordCosts(accId, costs){
  return Object.keys(costs).every(cur => (costs[cur]||0) <= 0 || availablePoints(accId, cur) >= costs[cur]);
}
function formatCosts(costs){
  return Object.keys(costs).filter(cur=>costs[cur]>0).map(cur=>{
    const m = curMeta(cur);
    return `${costs[cur]} ${m.symbol}${m.name}`;
  }).join(" + ") || "免費";
}
function costLabel(item){
  if(item.directMode) return `📝 ${item.directLabel || "直接兌換"}`;
  return formatCosts(item.costs || {general:0,special:0});
}

/* ---------------- 日期／日型輔助 ---------------- */
function getDayType(id){ return state.dayTypes.find(d=>d.id===id); }
function getDayTypeIdForDate(dateStr){
  if(state.dateAssignments[dateStr]) return state.dateAssignments[dateStr];
  const wd = parseDateStr(dateStr).getDay();
  return (wd===0 || wd===6) ? DT_HOLIDAY : DT_SCHOOL;
}
function getStepLog(dateStr, childId, stepId){ return state.dayLog[dateStr] && state.dayLog[dateStr][childId] ? state.dayLog[dateStr][childId][stepId] : undefined; }
function setStepLog(dateStr, childId, stepId, entry){
  if(!state.dayLog[dateStr]) state.dayLog[dateStr] = {};
  if(!state.dayLog[dateStr][childId]) state.dayLog[dateStr][childId] = {};
  state.dayLog[dateStr][childId][stepId] = entry;
}
function dateHasIncomplete(dateStr, childId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  if(!dt) return false;
  if(dateStr >= todayStr()) return false;
  return dt.steps.some(s=> s.type==="task" && (!getStepLog(dateStr, childId, s.id) || getStepLog(dateStr, childId, s.id).status==="rejected"));
}

function fmtTime(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDateFull(dateStr){ const d = parseDateStr(dateStr); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${WEEKDAY_LABELS[d.getDay()]}`; }
function getAccount(id){ return state.accounts.find(a=>a.id===id); }
function currentAccount(){ return getAccount(currentAccountId); }
function sessionAccount(){ return session ? getAccount(session.accountId) : null; }
function children(){ return state.accounts.filter(a=>a.role==="child"); }
function parents(){ return state.accounts.filter(a=>a.role==="parent"); }
function eligibleProviders(){ return state.accounts.filter(a=>a.role==="parent"||a.role==="admin"); }
function roleLabel(r){ return r==="admin"?"主管理者":r==="parent"?"家長":"寶貝"; }
async function persistAndRender(){ await saveState(); render(); }
function ptsBadge(amount, currency, sign){
  const m = curMeta(currency);
  const cls = sign==="neg" ? "neg" : (currency===CUR_SPECIAL ? "spec" : "gen");
  const prefix = sign==="neg" ? "-" : "+";
  return `<span class="pts ${sign==='neg'?'neg':'pos '+cls}">${prefix}${amount} ${m.symbol}</span>`;
}

/* ---------------- 登入／登出／管理者切換 ---------------- */
async function attemptLogin(accountId, passwordPlain){
  const acc = getAccount(accountId);
  if(!acc){ loginError = "找不到這個帳號"; render(); return; }
  const hash = await sha256Hex(passwordPlain || "");
  if(hash !== acc.passwordHash){ loginError = "密碼錯誤，請再試一次"; render(); return; }
  loginError = "";
  session = { accountId };
  saveSession();
  currentAccountId = accountId;
  activeTab = "home";
  childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  selectedDate = todayStr();
  calMonth = new Date();
  render();
}
function logout(){ session = null; saveSession(); currentAccountId = null; loginError = ""; render(); }
async function adminActAs(accountId){
  if(!session) return;
  session.actingAs = accountId;
  saveSession();
  currentAccountId = accountId;
  activeTab = "home";
  const acc = getAccount(accountId);
  childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  selectedDate = todayStr(); calMonth = new Date();
  render();
}
function adminReturnToSelf(){
  if(!session) return;
  delete session.actingAs;
  saveSession();
  currentAccountId = session.accountId;
  activeTab = "home";
  childViewFilter = children()[0] ? children()[0].id : null;
  render();
}
async function changePassword(accountId, newPlain){
  if(!newPlain || newPlain.length < 2){ showToast("密碼至少需要2個字元"); return; }
  const acc = getAccount(accountId); if(!acc) return;
  acc.passwordHash = await sha256Hex(newPlain);
  showToast(`已更新「${acc.name}」的密碼`);
  await persistAndRender();
}

/* ---------------- 事件：日曆步驟回報／審核 ---------------- */
async function submitStep(dateStr, childId, stepId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  const step = dt.steps.find(s=>s.id===stepId); if(!step) return;
  setStepLog(dateStr, childId, stepId, {status:"pending", ts: Date.now()});
  showToast(`已送出「${step.name}」，等待審核`);
  await persistAndRender();
}
async function approveStep(dateStr, childId, stepId){
  const dt = getDayType(getDayTypeIdForDate(dateStr));
  const step = dt.steps.find(s=>s.id===stepId); if(!step) return;
  setStepLog(dateStr, childId, stepId, {status:"approved", ts: Date.now()});
  if(step.points) addLedgerEntry(childId, step.points, `${dt.name}｜${step.name}`, dateStr, step.currency||CUR_GENERAL);
  showToast(`已核准「${step.name}」`);
  await persistAndRender();
}
async function rejectStep(dateStr, childId, stepId){

/* ---------------- 待審日曆任務彙整 ---------------- */
function getPendingCalendarSteps(){
  const list = [];
  Object.keys(state.dayLog).forEach(date=>{
    Object.keys(state.dayLog[date]).forEach(childId=>{
      Object.keys(state.dayLog[date][childId]).forEach(stepId=>{
        const log = state.dayLog[date][childId][stepId];
        if(log.status!=="pending") return;
        const dt = getDayType(getDayTypeIdForDate(date));
        const step = dt ? dt.steps.find(s=>s.id===stepId) : null;
        list.push({ date, childId, stepId, stepName: step?step.name:"（項目已刪除）", points: step?step.points:0, currency: step?(step.currency||CUR_GENERAL):CUR_GENERAL, dayTypeName: dt?dt.name:"", ts: log.ts });
      });
    });
  });
  list.sort((a,b)=> a.date===b.date ? a.ts-b.ts : (a.date < b.date ? -1 : 1));
  return list;
}
function countPendingSteps(){ return getPendingCalendarSteps().length; }

  if(!childId){ showToast("請先選擇孩子"); return; }
  addLedgerEntry(childId, p, (desc && desc.trim()) || "家長加點", "手動加點", currency||CUR_GENERAL);

async function exchangeCurrency(childId, specialAmount){
  const amt = Number(specialAmount);
  if(!amt || amt<=0){ showToast("請輸入大於0的金星數量"); return; }
  if(availablePoints(childId, CUR_SPECIAL) < amt){ showToast("金星不足"); return; }

  addLedgerEntry(childId, gained, `由${curMeta(CUR_SPECIAL).name}轉換`, "點數轉換", CUR_GENERAL);
  showToast(`已將 ${amt} ${curMeta(CUR_SPECIAL).name} 轉換為 ${gained} ${curMeta(CUR_GENERAL).name}`);

function serializeRuleList(type){
  return state.rules[type].map(r=> `${r.icon||""}|${r.name}|${r.points}|${r.currency||CUR_GENERAL}|${(r.desc||"").replace(/\|/g,"／")}`).join("\n");
}
function serializeRewardList(){
  return state.rules.rewards.map(r=>{
    const costs = r.costs || {general:0,special:0};
    const providerLabelText = providerIds(r).includes("common") ? "common" : providerIds(r).map(id=>{ const a=getAccount(id); return a?a.name:""; }).filter(Boolean).join("/");
    return `${r.icon||""}|${r.name}|${costs.general||0}|${costs.special||0}|${providerLabelText}|${(r.desc||"").replace(/\|/g,"／")}`;
  }).join("\n");
}
function serializeStepList(dtId){
  const dt = getDayType(dtId); if(!dt) return "";
  return dt.steps.map(s=> `${s.icon||""}|${s.name}|${s.points}|${s.currency||CUR_GENERAL}|${s.type}|${(s.desc||"").replace(/\|/g,"／")}`).join("\n");
}
function parseRuleLines(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const [icon,name,points,currency,desc] = line.split("|");
    return { id: uid("r"), icon:(icon||"").trim(), name:(name||"").trim(), points:Number(points)||0, currency:(currency||CUR_GENERAL).trim()||CUR_GENERAL, desc:(desc||"").trim(), batch:"批次匯入" };
  }).filter(x=>x.name);
}
function parseRewardLines(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const [icon,name,g,s,providerRaw,desc] = line.split("|");
    const pRaw = (providerRaw||"").trim();
    let providers = ["common"];
    if(pRaw && pRaw!=="common"){
      const names = pRaw.split("/").map(n=>n.trim()).filter(Boolean);
      const ids = names.map(n=>{ const m = eligibleProviders().find(p=>p.name===n); return m?m.id:null; }).filter(Boolean);
      providers = ids.length>0 ? ids : ["common"];
    }
    return { id: uid("r"), icon:(icon||"").trim(), name:(name||"").trim(), costs:{general:Number(g)||0, special:Number(s)||0}, providers, desc:(desc||"").trim(), batch:"批次匯入" };
  }).filter(x=>x.name);
}
function parseStepLines(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const [icon,name,points,currency,type,desc] = line.split("|");
    return { id: uid("st"), icon:(icon||"").trim(), name:(name||"").trim(), points:Number(points)||0, currency:(currency||CUR_GENERAL).trim()||CUR_GENERAL, type:((type||"task").trim()==="note"?"note":"task"), desc:(desc||"").trim(), order:i+1 };
  }).filter(x=>x.name);
}

/* ---------------- 拖拉排序 ---------------- */
let dragCtx = null;
function resolveDragArray(listKey){
  if(listKey.startsWith("rules:")){ const t = listKey.split(":")[1]; return state.rules[t]; }
  if(listKey.startsWith("daytype:")){ const id = listKey.split(":")[1]; const dt = getDayType(id); return dt ? dt.steps : null; }
  return null;
}
function initDragReorder(){
  document.querySelectorAll(".drag-handle").forEach(handle=>{ handle.addEventListener("pointerdown", onDragHandleDown); });
}
function onDragHandleDown(e){
  e.preventDefault();
  const handle = e.currentTarget;
  const itemEl = handle.closest(".drag-item");
  const container = handle.closest(".drag-list");
  if(!itemEl || !container) return;
  const listKey = container.dataset.listKey;
  const arr = resolveDragArray(listKey);
  if(!arr) return;
  const itemId = itemEl.dataset.itemId;
  const startIndex = arr.findIndex(x=>x.id===itemId);
  if(startIndex<0) return;
  const siblings = Array.from(container.querySelectorAll(".drag-item"));
  const rects = siblings.map(el=>({ id: el.dataset.itemId, rect: el.getBoundingClientRect() }));
  dragCtx = { listKey, arr, startIndex, currentTargetIndex: startIndex, itemEl, container, rects, startY: e.clientY };
  itemEl.classList.add("dragging");
  itemEl.style.zIndex = "50";
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragEnd);
}
function onDragMove(e){
  if(!dragCtx) return;
  const dy = e.clientY - dragCtx.startY;
  dragCtx.itemEl.style.transform = `translateY(${dy}px)`;
  let targetIndex = 0;
  for(let i=0;i<dragCtx.rects.length;i++){
    const mid = dragCtx.rects[i].rect.top + dragCtx.rects[i].rect.height/2;
    if(e.clientY > mid) targetIndex = i; else break;
  }
  dragCtx.container.querySelectorAll(".drag-item").forEach(el=>el.classList.remove("drop-indicator"));
  if(targetIndex !== dragCtx.startIndex){
    const targetId = dragCtx.rects[targetIndex].id;
    const targetEl = dragCtx.container.querySelector(`[data-item-id="${targetId}"]`);
    if(targetEl && targetEl !== dragCtx.itemEl) targetEl.classList.add("drop-indicator");
  }
  dragCtx.currentTargetIndex = targetIndex;
}
async function onDragEnd(){
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  if(!dragCtx) return;
  const { arr, startIndex, currentTargetIndex, itemEl, container } = dragCtx;
  itemEl.classList.remove("dragging");
  itemEl.style.transform = "";
  itemEl.style.zIndex = "";
  container.querySelectorAll(".drag-item").forEach(el=>el.classList.remove("drop-indicator"));
  const changed = currentTargetIndex !== startIndex;
  dragCtx = null;
  if(changed){
    const [moved] = arr.splice(startIndex,1);
    arr.splice(currentTargetIndex,0,moved);
    await persistAndRender();
  }
}

      <div class="bal-box held"><div class="label">保留中 銅星</div><div class="num">${heldPoints(acc.id,CUR_GENERAL)} 🔒</div></div>
      <div class="bal-box held"><div class="label">保留中 金星</div><div class="num">${heldPoints(acc.id,CUR_SPECIAL)} 🔒</div></div>
    </div>`;
  }

  const tabs = isChild
    ? [["home","🏠 首頁"],["extra","🎯 額外活動"],["shop","🎁 兌換商店"],["ledger","📒 我的紀錄"]]
    : [["home","📅 日曆"],["review","✅ 待審核"],["points","💰 點數調整"],["daytypes","🗓️ 日期類型"],["rules","🛠️ 規則管理"],["importexport","📋 批次匯入"],["trash","🗑️ 垃圾桶"],["overview","👪 家庭總覽"]].concat(isAdminOwnDashboard ? [["accounts","🔑 帳戶管理"]] : []);
  if(!activeTab) activeTab = "home";

  html += `<nav class="tabs">${tabs.map(([k,l])=>{
    let badge = "";
    if(!isChild && k==="review"){
      const n = state.pendingTasks.filter(t=>t.status==="pending").length + state.pendingRedemptions.filter(r=>r.status==="held").length + countPendingSteps();
      if(n>0) badge = ` <span class="pending-badge">●${n}</span>`;
    }
    if(!isChild && k==="trash" && state.trash.length>0) badge = ` <span class="pending-badge">${state.trash.length}</span>`;
    return `<button class="${activeTab===k?"active":""}" data-tab="${k}">${l}${badge}</button>`;
  }).join("")}</nav>`;

  html += `<main>`;
  if(isChild){
    if(activeTab==="home") html += renderCalendarSection(acc, false);
    else if(activeTab==="extra") html += renderExtraTab(acc);
    else if(activeTab==="shop") html += renderShopTab(acc);
    else if(activeTab==="ledger") html += renderLedgerTab(acc);
  } else {
    if(activeTab==="home") html += renderCalendarSection(acc, true);
    else if(activeTab==="review") html += renderReviewTab();
    else if(activeTab==="points") html += renderPointsTab();
    else if(activeTab==="daytypes") html += renderDayTypesTab();
    else if(activeTab==="rules") html += renderRulesTab();
    else if(activeTab==="importexport") html += renderImportExportTab();
    else if(activeTab==="trash") html += renderTrashTab();
    else if(activeTab==="accounts") html += renderAccountsTab();
    else if(activeTab==="overview") html += renderOverviewTab();
  }
  html += `</main>`;
  app.innerHTML = html;
  bindEvents();
}

function bindLoginEvents(){
  const btn = document.querySelector('[data-action="doLogin"]');
  if(btn) btn.addEventListener("click", async ()=>{

    const pw = document.getElementById("loginPassword").value;

/* ---------------- 日曆區塊 ---------------- */
function renderCalendarSection(acc, isParentView){
  if(!calMonth) calMonth = new Date();
  if(!selectedDate) selectedDate = todayStr();
  const targetChildId = isParentView ? (childViewFilter || (children()[0] && children()[0].id)) : acc.id;
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y, m, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = `${y}年 ${m+1}月`;

  let html = `<div class="card">`;
  if(isParentView && children().length>1){
    html += `<div class="child-tab-select">${children().map(k=>`<button data-action="setChildFilter" data-id="${k.id}" class="${targetChildId===k.id?"active":""}">${k.name}</button>`).join("")}</div>`;
  }
  html += `<div class="cal-head"><div class="cal-title">${monthLabel}</div>
      <div class="cal-nav"><button data-action="calPrev">‹</button><button class="today-btn" data-action="calToday">今天</button><button data-action="calNext">›</button></div>
    </div>
    <div class="weekday-row">${WEEKDAY_LABELS.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-grid">`;
  for(let i=0;i<startWeekday;i++) html += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const dtId = getDayTypeIdForDate(dateStr);
    const dt = getDayType(dtId);
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === selectedDate;
    const incomplete = targetChildId ? dateHasIncomplete(dateStr, targetChildId) : false;
    html += `<div class="cal-cell ${isToday?"today":""} ${isSelected?"selected":""} ${incomplete?"incomplete-mark":""}" data-action="selectDate" data-date="${dateStr}">
      <div class="dnum">${d}</div><div class="dot" style="background:${dt?dt.color:'#999'}"></div></div>`;
  }
  html += `</div>`;
  html += `<div class="daytype-legend">${state.dayTypes.map(dt=>`<span><span class="dot" style="background:${dt.color}"></span>${dt.name}</span>`).join("")}${isParentView?'<span>！ 紅色驚嘆號 ＝ 過去有未完成項目</span>':''}</div></div>`;
  html += renderDateDetail(selectedDate, targetChildId, isParentView);
  return html;
}
function renderDateDetail(dateStr, childId, isParentView){
  const dtId = getDayTypeIdForDate(dateStr);
  const dt = getDayType(dtId);
  const isToday = dateStr === todayStr();
  const isPast = dateStr < todayStr();
  const isFuture = dateStr > todayStr();
  let html = `<div class="card"><div class="date-detail-head"><div class="ddate">${fmtDateFull(dateStr)} ${isToday?"（今天）":""}</div></div>`;
  if(isParentView){
    html += `<div class="form-grid full" style="margin-bottom:10px;"><div><label class="f-label">這天的日期類型</label>
        <select class="field" data-action="changeDateType" data-date="${dateStr}">
          <option value="">（依平日/假日自動判斷：目前為 ${dt?dt.name:"未設定"}）</option>
          ${state.dayTypes.map(d=>`<option value="${d.id}" ${state.dateAssignments[dateStr]===d.id?"selected":""}>${d.name}</option>`).join("")}
        </select></div></div>`;
  } else {
    html += `<div class="section-tag">今日類型：<span class="batch-tag b2" style="margin-left:0;">${dt?dt.name:""}</span></div>`;
  }
  if(!dt || (dt.steps.length===0)){ html += `<div class="empty">這天還沒有設定任何項目</div></div>`; return html; }
  if(!childId){ html += `<div class="empty">尚未選擇孩子帳號</div></div>`; return html; }

  dt.steps.slice().forEach(step=>{
    if(step.type==="note"){ html += `<div class="note-card">📌 ${step.name}${step.desc?`｜${step.desc}`:""}</div>`; return; }
    const log = getStepLog(dateStr, childId, step.id);
    let chip = "", actionBtns = "";
    if(log && log.status==="approved"){ chip = `<span class="status-chip done">已完成</span>`; }
    else if(log && log.status==="pending"){
      chip = `<span class="status-chip pending">審核中</span>`;
      if(isParentView) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">核准</button>
        <button class="btn coral" data-action="rejectStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">拒絕</button>`;
    } else if(log && log.status==="rejected"){
      chip = `<span class="status-chip missing">未完成</span>`;
      if(!isParentView && isToday) actionBtns = `<button class="btn primary" data-action="submitStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">重新回報</button>`;
      if(isParentView) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">補登完成</button>`;
    } else {
      if(isFuture){ chip = `<span class="status-chip future">尚未到</span>`; }
      else if(isPast){ chip = `<span class="status-chip missing">未完成</span>`; }
      else { chip = `<span class="status-chip pending">待完成</span>`; }
      if(!isParentView && isToday) actionBtns = `<button class="btn primary" data-action="submitStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">✅ 我做到了</button>`;
      if(isParentView && !isFuture) actionBtns = `<button class="btn teal" data-action="approveStep" data-date="${dateStr}" data-child="${childId}" data-id="${step.id}">補登完成</button>`;
    }
    html += `<div class="task-item">${itemVisual(step,40)}<div class="t-main"><div class="t-name">${step.name}</div>${step.desc?`<div class="t-desc">${step.desc}</div>`:""}</div>
      <div class="btn-row">${step.points? ptsBadge(step.points, step.currency||CUR_GENERAL, "pos") : `<span class="pts neutral">無點數</span>`}${chip}${actionBtns}</div></div>`;
  });
  if(isParentView){
    const hasPending = dt.steps.some(s=>{ const l=getStepLog(dateStr, childId, s.id); return l && l.status==="pending"; });
    if(hasPending) html += `<button class="btn teal" style="margin-top:6px;" data-action="approveAllSteps" data-date="${dateStr}" data-child="${childId}">全部核准</button>`;
  }
  html += `</div>`;
  return html;
}

function providerLabel(providers){
  if(!providers || providers.length===0 || providers.includes("common")) return "";
  const names = providers.map(id=>{ const a=getAccount(id); return a?a.name:null; }).filter(Boolean);
  if(names.length===0) return "";
  return `跟 ${names.join("、")} 兌換`;
}
function providerIds(reward){
  if(reward.providers) return reward.providers;
  if(reward.provider) return reward.provider==="common" ? ["common"] : [reward.provider];
  return ["common"];
}

function trashLabel(t){

/* ---------------- 事件綁定 ---------------- */
function bindEvents(){
  const actAsSelect = document.getElementById("actAsSelect");
  if(actAsSelect) actAsSelect.addEventListener("change", async (e)=>{ if(e.target.value) await adminActAs(e.target.value); });

  document.querySelectorAll("nav.tabs button").forEach(btn=>{ btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; render(); }); });
  const dtSelect = document.querySelector('[data-action="changeDateType"]');
  if(dtSelect) dtSelect.addEventListener("change", async (e)=>{ await setDateAssignment(e.target.dataset.date, e.target.value); });

  initDragReorder();
  document.querySelectorAll(".edit-name").forEach(input=>{
    input.addEventListener("change", async (e)=>{
      const v = e.target.value;
      if(e.target.dataset.kind==="rule") await updateRuleField(e.target.dataset.type, e.target.dataset.id, "name", v);
      else await updateStepField(e.target.dataset.daytype, e.target.dataset.id, "name", v);
    });
  });
  document.querySelectorAll(".edit-points").forEach(input=>{
    input.addEventListener("change", async (e)=>{
      const v = e.target.value;
      if(e.target.dataset.kind==="rule") await updateRuleField(e.target.dataset.type, e.target.dataset.id, "points", v);
      else await updateStepField(e.target.dataset.daytype, e.target.dataset.id, "points", v);
    });
  });
  document.querySelectorAll(".edit-currency").forEach(sel=>{
    sel.addEventListener("change", async (e)=>{
      const v = e.target.value;
      if(e.target.dataset.kind==="rule") await updateRuleField(e.target.dataset.type, e.target.dataset.id, "currency", v);
      else await updateStepField(e.target.dataset.daytype, e.target.dataset.id, "currency", v);
    });
  });
  document.querySelectorAll(".edit-reward-cost").forEach(input=>{
    input.addEventListener("change", async (e)=>{
      await updateRewardCost(e.target.dataset.id, e.target.dataset.currency, e.target.value);
    });
  });
  document.querySelectorAll(".provider-check").forEach(cb=>{
    cb.addEventListener("change", async (e)=>{
      const ruleId = e.target.dataset.id;
      const checked = Array.from(document.querySelectorAll(`.provider-check[data-id="${ruleId}"]:checked`)).map(x=>x.value);
      await setRewardProviders(ruleId, checked);
    });
  });
  document.querySelectorAll(".reward-direct-toggle").forEach(cb=>{
    cb.addEventListener("change", async (e)=>{ await setRewardDirectMode(e.target.dataset.id, e.target.checked); });
  });
  document.querySelectorAll(".edit-direct-label").forEach(input=>{
    input.addEventListener("change", async (e)=>{ await updateRuleField("rewards", e.target.dataset.id, "directLabel", e.target.value); });
  });
  const newRewardDirectToggle = document.getElementById("new_rewards_direct_toggle");
  if(newRewardDirectToggle){
    newRewardDirectToggle.addEventListener("change", (e)=>{
      document.getElementById("new_rewards_points_fields").style.display = e.target.checked ? "none" : "";
      document.getElementById("new_rewards_direct_field").style.display = e.target.checked ? "" : "none";
    });
  }
  document.querySelectorAll(".photo-input").forEach(inp=>{
    inp.addEventListener("change", async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const dataUrl = await compressImageFile(file);
        const kind = e.target.dataset.kind;
        const containerId = kind==="rule" ? e.target.dataset.type : e.target.dataset.daytype;
        await setItemPhoto(kind, containerId, e.target.dataset.id, dataUrl);
      }catch(err){ showToast("照片處理失敗，請再試一次"); console.error(err); }
    });
  });

  document.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.dataset.action;
    if(action==="changeDateType") return;
    el.addEventListener("click", async ()=>{
      try{
        if(action==="logout"){ logout(); return; }
        if(action==="adminReturn"){ adminReturnToSelf(); return; }
        if(action==="selectDate"){ selectedDate = el.dataset.date; render(); return; }
        if(action==="calPrev"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); return; }
        if(action==="calNext"){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); return; }
        if(action==="calToday"){ calMonth = new Date(); selectedDate = todayStr(); render(); return; }
        if(action==="setChildFilter"){ childViewFilter = el.dataset.id; render(); return; }
        if(action==="setRulesSubTab"){ rulesSubTab = el.dataset.sub; render(); return; }
        if(action==="pickIcon"){
          const kind = el.dataset.kind;
          const containerId = kind==="rule" ? el.dataset.type : el.dataset.daytype;
          await setItemIcon(kind, containerId, el.dataset.id, el.dataset.icon);
          return;
        }

        if(action==="submitStep") await submitStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="approveStep") await approveStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="rejectStep") await rejectStep(el.dataset.date, el.dataset.child, el.dataset.id);
        else if(action==="approveAllSteps") await approveAllSteps(el.dataset.date, el.dataset.child);
        else if(action==="approveAllStepsForChild") await approveAllPendingStepsForChild(el.dataset.id);
        else if(action==="submitExtra") await submitExtra(el.dataset.id);
        else if(action==="approveTask") await approveTask(el.dataset.id);
        else if(action==="rejectTask") await rejectTask(el.dataset.id);
        else if(action==="approveAllTasks") await approveAllTasks(el.dataset.id);
        else if(action==="applyDeduction") await applyDeduction(el.dataset.child, el.dataset.id);
        else if(action==="grantPoints"){
          const desc = document.getElementById("grant_desc").value;
          const points = document.getElementById("grant_points").value;
          const currency = document.getElementById("grant_currency").value;
          await grantPoints(el.dataset.child, points, desc, currency);
        }
        else if(action==="exchangeCurrency"){
          const amt = document.getElementById("exchange_amount").value;
          await exchangeCurrency(currentAccountId, amt);
        }
        else if(action==="requestRedeem") await requestRedeem(el.dataset.id);
        else if(action==="completeRedeem") await completeRedeem(el.dataset.id);
        else if(action==="cancelRedeem") await cancelRedeem(el.dataset.id);
        else if(action==="removeAccount") await removeAccount(el.dataset.id);
        else if(action==="resetPassword"){
          const pw = document.getElementById(`pw_${el.dataset.id}`).value;
          await changePassword(el.dataset.id, pw);
        }
        else if(action==="removeRule") await removeRule(el.dataset.type, el.dataset.id);
        else if(action==="removeDayTypeStep") await removeDayTypeStep(el.dataset.daytype, el.dataset.id);
        else if(action==="restoreTrash") await restoreTrashItem(el.dataset.id);
        else if(action==="permDeleteTrash") await permanentlyDeleteTrash(el.dataset.id);
        else if(action==="addDayType"){ const v = document.getElementById("new_daytype_name").value; await addDayType(v); }
        else if(action==="applyBulkRule"){
          const type = el.dataset.type;
          const text = document.getElementById(`bulk_${type}`).value;
          await applyBulkRuleList(type, text);
        }
        else if(action==="applyBulkReward"){
          const text = document.getElementById("bulk_rewards").value;
          await applyBulkRewardList(text);
        }
        else if(action==="applyBulkStep"){
          const dtId = el.dataset.daytype;
          const text = document.getElementById(`bulk_step_${dtId}`).value;
          await applyBulkStepList(dtId, text);
        }
        else if(action==="copyExport"){ await copyExportJson(); }
        else if(action==="applyFullImport"){
          const text = document.getElementById("full_import_text").value;
          await applyFullImport(text);
        }
        else if(action==="addDayTypeStep"){
          const dtId = el.dataset.daytype;
          const name = document.getElementById(`new_step_${dtId}_name`).value;
          const points = document.getElementById(`new_step_${dtId}_points`).value;
          const type = document.getElementById(`new_step_${dtId}_type`).value;
          const currency = document.getElementById(`new_step_${dtId}_currency`).value;
          await addDayTypeStep(dtId, name, points, type, currency);
        }
        else if(action==="addAccount"){
          const name = document.getElementById("new_acc_name").value;
          const role = document.getElementById("new_acc_role").value;
          const pw = document.getElementById("new_acc_password").value;
          await addAccount(name, role, pw);
        }
        else if(action==="addRule"){
          const type = el.dataset.type;
          const name = document.getElementById(`new_${type}_name`).value;
          const points = document.getElementById(`new_${type}_points`).value;
          const desc = document.getElementById(`new_${type}_desc`).value;
          const currency = document.getElementById(`new_${type}_currency`).value;
          await addRule(type, name, desc, points, "自訂", currency);
        }
        else if(action==="addRewardRule"){
          const name = document.getElementById("new_rewards_name").value;
          const desc = document.getElementById("new_rewards_desc").value;
          const general = document.getElementById("new_rewards_general").value;
          const special = document.getElementById("new_rewards_special").value;
          const providers = Array.from(document.querySelectorAll(".new_reward_provider:checked")).map(cb=>cb.value);
          const directMode = document.getElementById("new_rewards_direct_toggle").checked;
          const directLabel = document.getElementById("new_rewards_direct_label").value;
          await addRewardRule(name, desc, general, special, providers, directMode, directLabel);
        }
      }catch(err){ showToast("操作失敗，請再試一次"); console.error(err); }
    });
  });
}

/* ---------------- 初始化 ---------------- */
async function init(){
  await loadState();
  startRealtimeSync();
  session = loadSession();
  if(session && getAccount(session.accountId)){
    currentAccountId = session.actingAs && getAccount(session.actingAs) ? session.actingAs : session.accountId;
    activeTab = "home";
    const acc = currentAccount();
    childViewFilter = acc.role !== "child" ? (children()[0] ? children()[0].id : null) : null;
  } else {
    session = null;
  }
  calMonth = new Date();
  selectedDate = todayStr();
  render();
}
init();
</script>
